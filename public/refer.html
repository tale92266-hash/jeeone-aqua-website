<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Refer & Earn — JeeOne Aqua</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/icons.js"></script>
<div class="app-header">
  <div class="header-row" style="margin-bottom:0">
    <a class="icon-btn" href="javascript:history.back()"><script>document.write(ic("back",22))</script></a>
    <span class="name" style="font-size:16px">Refer & Earn</span>
  </div>
</div>
<div style="text-align:center;padding:30px 24px 10px">
  <div style="font-size:52px;color:var(--gold)"><script>document.write(ic("gift",56))</script></div>
  <h1 class="serif" style="color:var(--green-dark);font-size:22px;margin:12px 0 6px">Invite Friends, Earn ₹50</h1>
  <p style="color:var(--muted);font-size:14px">Share your code — you get ₹50 wallet credit,<br>your friend gets 20% off their first order.</p>
</div>
<div class="panel" style="text-align:center">
  <div style="font-size:12px;color:var(--muted)">Your referral code</div>
  <div style="font-size:28px;font-weight:800;letter-spacing:.15em;color:var(--green-dark);margin:8px 0">JEA50</div>
  <button class="btn btn-gold" onclick="share()">Share Invite</button>
  <button class="btn btn-green" style="margin-top:10px" onclick="navigator.clipboard&&navigator.clipboard.writeText('JEA50');this.textContent='Copied!'">Copy Code</button>
</div>
<script>
function share() {
  const t = 'Get pure JeeOne Aqua water! Use my code JEA50 for 20% off: http://localhost:8080';
  if (navigator.share) navigator.share({ title: 'JeeOne Aqua', text: t });
  else { navigator.clipboard && navigator.clipboard.writeText(t); alert('Invite link copied!'); }
}
</script>

<script src="/js/img_8.js"></script>

</body>
</html>
