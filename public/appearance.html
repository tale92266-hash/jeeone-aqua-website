<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Appearance — JeeOne Aqua</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.tcard { display:flex; align-items:center; gap:14px; background:#fff; border:1.5px solid var(--line);
  border-radius:12px; padding:16px; margin-bottom:10px; cursor:pointer; }
.tcard.sel { border:2px solid var(--green); }
.tcard .pv { width:56px; height:56px; border-radius:12px; flex-shrink:0; border:1px solid var(--line); }
.tcard .pv.light { background:linear-gradient(135deg,#fff 50%,#F5F1E6 50%); }
.tcard .pv.dark { background:linear-gradient(135deg,#0E1A14 50%,#1E3A2A 50%); }
.tcard b { font-size:15px; display:block; }
.tcard span { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<script src="/js/icons.js"></script>
<div class="app-header">
  <div class="header-row" style="margin-bottom:0">
    <a class="icon-btn" href="javascript:history.back()"><script>document.write(ic("back",22))</script></a>
    <span class="name" style="font-size:16px">Appearance</span>
  </div>
</div>
<div style="padding:16px 12px">
  <div class="tcard" id="tLight" onclick="setTheme('light')">
    <div class="pv light"></div>
    <div><b>Light</b><span>Classic bright theme</span></div>
  </div>
  <div class="tcard" id="tDark" onclick="setTheme('dark')">
    <div class="pv dark"></div>
    <div><b>Dark</b><span>Easy on the eyes at night</span></div>
  </div>
  <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:16px">Dark mode coming soon — stay tuned!</p>
</div>
<script>
function setTheme(t) {
  localStorage.setItem('jea_theme', t);
  document.getElementById('tLight').classList.toggle('sel', t === 'light');
  document.getElementById('tDark').classList.toggle('sel', t === 'dark');
  if (t === 'dark') alert('Dark mode coming soon!');
}
setTheme(localStorage.getItem('jea_theme') || 'light');
</script>
<script src="/js/img_0.js"></script>
<script src="/js/img_1.js"></script>
<script src="/js/img_3.js"></script>
<script src="/js/img_4.js"></script>
<script src="/js/img_5.js"></script>
<script src="/js/img_6.js"></script>
<script src="/js/img_7.js"></script>
<script src="/js/img_8.js"></script>
<script src="/js/imgfix4.js"></script>
<script src="/js/imgfix.js"></script>
</body>
</html>
