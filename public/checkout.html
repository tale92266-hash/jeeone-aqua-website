<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checkout — JeeOne Aqua</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
/* Step indicator */
.steps { display:flex; align-items:flex-start; padding:16px 24px 6px; background:#fff; }
.step { flex:1; display:flex; flex-direction:column; align-items:center; }
.step .dot { width:36px; height:36px; border-radius:50%; background:#D5DCD5; color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; }
.step.done .dot, .step.now .dot { background:var(--green); }
.step .lbl { font-size:11px; margin-top:4px; color:var(--muted); font-weight:600; }
.step.now .lbl { color:var(--green-dark); }
.step-line { flex:.6; height:2px; background:var(--line); margin-top:18px; }
.step-line.done { background:var(--green); }

/* Address cards */
.acard { background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer; }
.acard.sel { border:2.5px solid var(--green); background:#FAFDFB; }
.acard .tag { display:inline-block; font-size:10px; font-weight:800; background:var(--gold-pale); color:#8A6D1B;
  padding:3px 10px; border-radius:10px; margin-bottom:6px; text-transform:uppercase; }
.acard .nm { font-weight:700; font-size:14px; }
.acard .ad { font-size:13px; color:var(--muted); margin-top:4px; }
.add-addr-btn { width:100%; padding:13px; border:1.5px solid var(--green); background:#fff; color:var(--green-dark);
  border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; margin-top:4px; }

/* Chips */
.chip-row { display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px; scrollbar-width:none; }
.chip-row::-webkit-scrollbar { display:none; }
.dchip { padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:#fff;
  font-size:14px; font-weight:500; color:var(--ink); cursor:pointer; white-space:nowrap; min-height:32px; }
.dchip.on { background:var(--green); border-color:var(--green); color:#fff; font-weight:600; }

/* Payment cards */
.pcard { background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer; }
.pcard.sel { border:2px solid var(--green); }
.pcard .prow { display:flex; align-items:center; gap:12px; }
.pcard .pic { width:38px; height:38px; border-radius:10px; background:var(--green-tint);
  display:flex; align-items:center; justify-content:center; color:var(--green); flex-shrink:0; }
.pcard .pt { flex:1; } .pcard .pt b { font-size:14px; display:block; } .pcard .pt span { font-size:12px; color:var(--muted); }
.pcard .radio { width:20px; height:20px; border-radius:50%; border:2px solid #C5CFC5; position:relative; flex-shrink:0; }
.pcard.sel .radio { border-color:var(--green); }
.pcard.sel .radio::after { content:''; position:absolute; inset:3px; border-radius:50%; background:var(--green); }
.pcard .extra { display:none; margin-top:12px; }
.pcard.sel .extra { display:block; }

/* Summary */
.sum-card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 6px rgba(28,43,35,.08); }

/* Bottom bar */
.bbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
  background:#fff; border-top:1px solid var(--line); padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  display:flex; gap:12px; z-index:50; box-shadow:0 -2px 12px rgba(28,43,35,.1); }
.bbar .btn { margin:0; }
.btn-outline { background:#fff; border:1.5px solid var(--green); color:var(--green-dark); }
.sec-title { font-size:16px; font-weight:700; color:var(--ink); margin:20px 0 4px; }
.sec-title:first-child { margin-top:0; }
.stepview { display:none; padding:0 12px; }
.stepview.on { display:block; animation:fadein .2s; }
.addr-form { background:#fff; border-radius:12px; padding:16px; margin-top:10px; }
</style>
</head>
<body>
<script src="/js/icons.js"></script>
<div class="app-header">
  <div class="header-row" style="margin-bottom:0">
    <a class="icon-btn" href="/cart.html"><script>document.write(ic("back",22))</script></a>
    <span class="name" style="font-size:16px">Checkout</span>
  </div>
</div>

<!-- Step indicator -->
<div class="steps">
  <div class="step now" id="st1"><div class="dot">1</div><div class="lbl">Address</div></div>
  <div class="step-line" id="sl12"></div>
  <div class="step" id="st2"><div class="dot">2</div><div class="lbl">Slot</div></div>
  <div class="step-line" id="sl23"></div>
  <div class="step" id="st3"><div class="dot">3</div><div class="lbl">Payment</div></div>
</div>

<!-- STEP 1: Address -->
<div class="stepview on" id="sv1">
  <div class="sec-title">Delivery Address</div>
  <div id="addrList"></div>
  <button class="add-addr-btn" onclick="toggleForm()">+ Add New Address</button>
  <div class="addr-form" id="addrForm" style="display:none">
    <div class="chip-row" id="ftags">
      <button class="dchip on" data-t="Home">Home</button>
      <button class="dchip" data-t="Office">Office</button>
      <button class="dchip" data-t="Other">Other</button>
    </div>
    <label>Full Name</label><input id="fName" placeholder="Receiver's name">
    <label>Phone</label><input id="fPhone" placeholder="10-digit mobile" maxlength="10" inputmode="numeric">
    <label>Address</label><textarea id="fAddr" rows="3" placeholder="House no, street, landmark, pincode"></textarea>
    <button class="btn btn-green" style="margin-bottom:8px" onclick="useLoc()"><script>document.write(ic("location",18))</script> Use My Location</button>
    <button class="btn btn-gold" onclick="saveAddr()">Save Address</button>
  </div>
  <div style="height:100px"></div>
</div>

<!-- STEP 2: Slot -->
<div class="stepview" id="sv2">
  <div class="sec-title">Delivery Day</div>
  <div class="chip-row" id="dayRow"></div>
  <div class="sec-title">Time Window</div>
  <div class="chip-row" id="slotRow" style="flex-wrap:wrap"></div>
  <div style="height:100px"></div>
</div>

<!-- STEP 3: Payment -->
<div class="stepview" id="sv3">
  <div class="sec-title">Payment Method</div>
  <div id="payCards"></div>
  <div class="sec-title">Order Summary</div>
  <div class="sum-card"><div id="sumBody"></div></div>
  <div style="height:100px"></div>
</div>

<!-- Bottom bar -->
<div class="bbar">
  <button class="btn btn-outline" id="btnBack" style="display:none;flex:0 0 110px" onclick="goStep(step-1)">Back</button>
  <button class="btn btn-green" id="btnNext" style="flex:1" onclick="nextStep()">Continue</button>
</div>

<script src="/js/app.js"></script>
<script>
let step = 1, addrs = [], selAddr = 0, ftag = 'Home';
let dayOff = 0, slotIx = 0, payMethod = 'cod', upiId = '', cardNum = '', cardExp = '', cardCvv = '';
const SLOTS = ['9 AM – 12 PM', '12 PM – 3 PM', '3 PM – 6 PM', '6 PM – 9 PM'];
const PAYMENTS = [
  { id: 'cod', t: 'Cash on Delivery', s: 'Pay cash or UPI when your water arrives', icon: 'wallet' },
  { id: 'upi', t: 'UPI', s: 'Pay instantly via UPI ID', icon: 'flash' },
  { id: 'card', t: 'Credit / Debit Card', s: 'Visa, Mastercard, RuPay', icon: 'offer' },
];

function dayLabel(o) {
  const d = new Date(); d.setDate(d.getDate() + o);
  if (o === 0) return 'Today'; if (o === 1) return 'Tomorrow';
  return d.toLocaleDateString('en-IN', { weekday: 'short' }) + ' ' + d.getDate();
}
function loadAddrs() {
  try { addrs = JSON.parse(localStorage.getItem('jea_addrs') || '[]'); } catch(e) { addrs = []; }
  selAddr = parseInt(localStorage.getItem('jea_addr_sel') || '0') || 0;
  if (selAddr >= addrs.length) selAddr = 0;
}

function renderAddrs() {
  document.getElementById('addrList').innerHTML = addrs.length ? addrs.map((a, i) => `
    <div class="acard ${i === selAddr ? 'sel' : ''}" onclick="selAddr=${i};localStorage.setItem('jea_addr_sel',${i});renderAddrs()">
      <span class="tag">${a.tag}</span>
      <div class="nm">${a.name} • ${a.phone}</div>
      <div class="ad">${a.addr}</div>
    </div>`).join('')
    : '<p style="color:var(--muted);font-size:14px;margin-bottom:10px">No saved addresses. Add one below.</p>';
  document.querySelectorAll('#ftags .dchip').forEach(el => el.onclick = () => {
    ftag = el.dataset.t;
    document.querySelectorAll('#ftags .dchip').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
  });
}
function toggleForm() {
  const f = document.getElementById('addrForm');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}
function useLoc() {
  if (!navigator.geolocation) return alert('Location not supported');
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
      const d = await r.json();
      document.getElementById('fAddr').value = d.display_name || '';
    } catch(e) { alert('Could not fetch address'); }
  }, e => alert('Location error: ' + e.message), { timeout: 15000 });
}
function saveAddr() {
  const name = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const addr = document.getElementById('fAddr').value.trim();
  if (!name) return alert('Enter name');
  if (!/^\d{10}$/.test(phone)) return alert('Enter valid 10-digit phone');
  if (!addr) return alert('Enter address');
  addrs.push({ tag: ftag, name, phone, addr });
  localStorage.setItem('jea_addrs', JSON.stringify(addrs));
  selAddr = addrs.length - 1;
  localStorage.setItem('jea_addr_sel', selAddr);
  document.getElementById('fName').value = ''; document.getElementById('fPhone').value = ''; document.getElementById('fAddr').value = '';
  toggleForm(); renderAddrs();
}

function renderSlots() {
  document.getElementById('dayRow').innerHTML = [0,1,2,3,4,5,6].map(o =>
    `<button class="dchip ${o === dayOff ? 'on' : ''}" onclick="dayOff=${o};renderSlots()">${dayLabel(o)}</button>`).join('');
  document.getElementById('slotRow').innerHTML = SLOTS.map((s, i) =>
    `<button class="dchip ${i === slotIx ? 'on' : ''}" onclick="slotIx=${i};renderSlots()">${s}</button>`).join('');
}

function renderPay() {
  document.getElementById('payCards').innerHTML = PAYMENTS.map(p => `
    <div class="pcard ${p.id === payMethod ? 'sel' : ''}" onclick="payMethod='${p.id}';renderPay()">
      <div class="prow">
        <div class="pic">${ic(p.icon, 22)}</div>
        <div class="pt"><b>${p.t}</b><span>${p.s}</span></div>
        <div class="radio"></div>
      </div>
      ${p.id === 'upi' ? `<div class="extra"><label>UPI ID</label><input id="inUpi" placeholder="yourname@upi" value="${upiId}" onclick="event.stopPropagation()" oninput="upiId=this.value"></div>` : ''}
      ${p.id === 'card' ? `<div class="extra" onclick="event.stopPropagation()">
        <label>Card Number</label><input id="inCard" placeholder="1234 5678 9012 3456" maxlength="19" value="${cardNum}" oninput="cardNum=this.value">
        <div style="display:flex;gap:8px">
          <div style="flex:1"><label>Expiry</label><input placeholder="MM/YY" maxlength="5" value="${cardExp}" oninput="cardExp=this.value"></div>
          <div style="flex:1"><label>CVV</label><input placeholder="•••" maxlength="4" type="password" value="${cardCvv}" oninput="cardCvv=this.value"></div>
        </div></div>` : ''}
    </div>`).join('');
  const sub = cartTotal(), del = sub >= 199 ? 0 : 20, items = cartCount();
  const mrp = Object.entries(cart).reduce((s, [id, q]) => {
    const p = PRODUCTS.find(x => x.id === id); return s + (p ? p.mrp * q : 0);
  }, 0);
  const disc = mrp - sub;
  document.getElementById('sumBody').innerHTML = `
    <div class="bill-row"><span style="color:var(--muted)">${items} item${items > 1 ? 's' : ''}</span></div>
    <div class="bill-row"><span style="color:var(--muted)">Subtotal</span><span>₹${sub}</span></div>
    ${disc > 0 ? `<div class="bill-row"><span style="color:var(--green)">Discount</span><span style="color:var(--green);font-weight:700">− ₹${disc}</span></div>` : ''}
    <div class="bill-row"><span style="color:var(--muted)">Delivery</span><span class="${del === 0 ? 'free' : ''}">${del === 0 ? 'FREE' : '₹' + del}</span></div>
    <div class="bill-row total"><span>To Pay</span><span>₹${sub + del}</span></div>`;
}

function goStep(n) {
  step = Math.max(1, Math.min(3, n));
  [1, 2, 3].forEach(i => {
    document.getElementById('sv' + i).classList.toggle('on', i === step);
    const st = document.getElementById('st' + i);
    st.classList.toggle('now', i === step);
    st.classList.toggle('done', i < step);
    st.querySelector('.dot').innerHTML = i < step ? '✓' : i;
  });
  document.getElementById('sl12').classList.toggle('done', step > 1);
  document.getElementById('sl23').classList.toggle('done', step > 2);
  document.getElementById('btnBack').style.display = step > 1 ? 'block' : 'none';
  document.getElementById('btnNext').textContent = step === 3 ? 'Place Order' : 'Continue';
  if (step === 2) renderSlots();
  if (step === 3) renderPay();
  window.scrollTo(0, 0);
}

function nextStep() {
  if (step === 1) {
    if (!addrs.length) return alert('Please add a delivery address');
    goStep(2);
  } else if (step === 2) {
    goStep(3);
  } else {
    if (payMethod === 'upi' && !upiId.trim()) return alert('Please enter your UPI ID');
    if (payMethod === 'card' && cardNum.replace(/\s/g, '').length < 12) return alert('Please enter a valid card number');
    placeOrder();
  }
}

async function placeOrder() {
  const a = addrs[selAddr];
  const sub = cartTotal(), del = sub >= 199 ? 0 : 20;
  const items = Object.entries(cart).map(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id === id);
    return { id, name: p.name, size: p.size, price: p.price, qty };
  });
  const payNames = { cod: 'Cash on Delivery', upi: 'UPI', card: 'Card' };
  const btn = document.getElementById('btnNext');
  btn.textContent = 'Placing…'; btn.disabled = true;
  try {
    const d = await apiPost('/api/order', { items, total: sub + del, name: a.name, phone: a.phone,
        address: `${a.tag}: ${a.addr}`, slot: dayLabel(dayOff) + ', ' + SLOTS[slotIx],
        payment: payNames[payMethod] + (payMethod === 'upi' ? ' (' + upiId + ')' : '') });
    if (d.ok) {
      cart = {}; saveCart();
      try {
        const ns = JSON.parse(localStorage.getItem('jea_notifs') || '[]');
        ns.unshift({ id: Date.now(), type: 'order', title: 'Order placed!',
          text: 'Your order ' + d.orderId + ' has been confirmed.', time: Date.now(), read: false });
        localStorage.setItem('jea_notifs', JSON.stringify(ns.slice(0, 50)));
      } catch(e) {}
      location.href = '/success.html?id=' + d.orderId;
    }
    else { alert('Order failed, try again'); btn.textContent = 'Place Order'; btn.disabled = false; }
  } catch(e) { alert('Network error'); btn.textContent = 'Place Order'; btn.disabled = false; }
}

async function init() {
  await loadProducts();
  if (!cartCount()) { location.href = '/cart.html'; return; }
  loadAddrs(); renderAddrs(); goStep(1);
}
init();
</script>
</body>
</html>
